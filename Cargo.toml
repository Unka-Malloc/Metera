[workspace]
resolver = "3"
members = [
    "crates/agent-statistics",
    "crates/collection-store",
    "crates/balance-detector",
    "crates/token-usage-detector",
]

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/Unka-Malloc/Metera"

[workspace.dependencies]
token-usage-detector = { path = "crates/token-usage-detector", version = "0.2.1" }
collection-store = { path = "crates/collection-store", version = "0.1.0" }
# The flywheel owns the graph-run usage store this crate's journal shares.
acativa = "0.2.0"
anyhow = "1"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
