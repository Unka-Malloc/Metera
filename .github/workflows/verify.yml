name: Verify

on:
  push:
    branches: [main]
    tags: ["*-v[0-9]*"]
  pull_request:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain @stable, installing the workspace floor. The
      # kernel itself builds in the pinned Docker image scripts/build-kernel.sh
      # names, which the runner's Docker runs natively.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      # actions/setup-go v7.0.0, at the version sdk/go/go.mod declares.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - name: Verify
        run: ./scripts/verify.sh
      - name: Package the tagged crate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: cargo package --locked -p "${TAG%-v*}"

  # The detector publishes a lower MSRV than the workspace toolchain: it is
  # built and tested alone on its declared floor so the embeddable SDK's
  # floor cannot silently drift up with workspace-only features.
  msrv-detector:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.85"
      - run: cargo test -p token-usage-detector --locked
