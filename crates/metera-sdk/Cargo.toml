[package]
name = "metera-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Rust host SDK for the shared Metera WebAssembly usage kernel"
include = ["Cargo.toml", "src/**", "wasm/metera.wasm"]

[features]
default = ["host"]
host = ["dep:thiserror", "dep:wasmi"]

[dependencies]
acop-usage-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = { version = "2", optional = true }
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "std", "validate", "memory64", "auto-dispatch"], optional = true }
